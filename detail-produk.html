<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detail Produk — Klinik Makmur Jaya</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/product.css">
</head>
<body>
<a href="#konten-utama" class="skip-link">Lompat ke konten utama</a>

<header class="site-header">
  <nav class="navbar navbar-expand-lg py-2" aria-label="Navigasi utama">
    <div class="container">
      <a class="navbar-brand navbar-brand-kmj" href="index.html">
        <span class="logo-mark"><img src="images/logo.png" alt="Logo Klinik Makmur Jaya" class="logo-image"></span>
        Klinik Makmur Jaya
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navUtama" aria-controls="navUtama" aria-expanded="false" aria-label="Buka menu navigasi">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navUtama">
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link nav-link-kmj" href="index.html">Beranda</a></li>
          <li class="nav-item"><a class="nav-link nav-link-kmj active" aria-current="page" href="katalog.html">Katalog Obat</a></li>
        </ul>
        <div class="d-flex align-items-center gap-2">
          <a href="login.html" class="btn btn-outline-teal btn-sm"><i class="bi bi-person" aria-hidden="true"></i> Masuk</a>
          <a href="keranjang.html" class="btn btn-teal btn-sm cart-icon-wrap" aria-label="Lihat keranjang belanja">
            <i class="bi bi-bag" aria-hidden="true"></i> Keranjang
            <span class="badge d-none" data-cart-badge>0</span>
          </a>
        </div>
      </div>
    </div>
  </nav>
</header>

<main id="konten-utama">
  <div class="container section-wrap" id="wrapperDetail">
    <p class="text-center text-secondary py-5">Memuat detail produk...</p>
  </div>

  <!-- Template dirender oleh JavaScript setelah produk ditemukan -->
  <template id="templateDetail">
    <nav class="breadcrumb-kmj" aria-label="breadcrumb">
      <a href="index.html">Beranda</a> / <a href="katalog.html">Katalog</a> / <span data-slot="nama-breadcrumb"></span>
    </nav>

    <div class="row g-5">
      <div class="col-lg-5">
        <div class="product-visual large" data-slot="visual-utama"></div>
        <div class="detail-gallery-thumbs" data-slot="thumbs" role="tablist" aria-label="Galeri gambar produk"></div>
      </div>

      <div class="col-lg-7">
        <span class="badge-teal" data-slot="kategori"></span>
        <h1 class="mt-2 mb-2 h3" data-slot="nama"></h1>
        <div class="d-flex align-items-center gap-3 mb-3">
          <span class="detail-price" data-slot="harga"></span>
          <span class="stock-tag fs-6" data-slot="stok"></span>
        </div>
        <p class="text-secondary" data-slot="deskripsi"></p>

        <div class="d-flex align-items-center gap-3 my-4">
          <label for="qtyInput" class="fw-semibold mb-0">Jumlah</label>
          <div class="qty-stepper">
            <button type="button" id="qtyMinus" aria-label="Kurangi jumlah">−</button>
            <input type="number" id="qtyInput" value="1" min="1" aria-label="Jumlah produk">
            <button type="button" id="qtyPlus" aria-label="Tambah jumlah">+</button>
          </div>
        </div>

        <div class="d-flex gap-2 flex-wrap">
          <button type="button" class="btn btn-teal px-4" id="btnTambahKeranjang">
            <i class="bi bi-cart-plus" aria-hidden="true"></i> Tambah ke Keranjang
          </button>
          <a href="keranjang.html" class="btn btn-outline-teal px-4">Lihat Keranjang</a>
        </div>

        <div class="accordion info-accordion mt-4" id="infoAccordion">
          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#accKomposisi">Komposisi</button>
            </h2>
            <div id="accKomposisi" class="accordion-collapse collapse show" data-bs-parent="#infoAccordion">
              <div class="accordion-body" data-slot="komposisi"></div>
            </div>
          </div>
          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#accDosis">Dosis & Aturan Pakai</button>
            </h2>
            <div id="accDosis" class="accordion-collapse collapse" data-bs-parent="#infoAccordion">
              <div class="accordion-body" data-slot="dosis"></div>
            </div>
          </div>
          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#accEfekSamping">Efek Samping</button>
            </h2>
            <div id="accEfekSamping" class="accordion-collapse collapse" data-bs-parent="#infoAccordion">
              <div class="accordion-body" data-slot="efek-samping"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </template>
</main>

<footer class="site-footer">
  <div class="container py-5">
    <div class="row g-4">
      <div class="col-lg-6">
        <h6><i class="bi bi-capsule" aria-hidden="true"></i> Klinik Makmur Jaya</h6>
        <p class="small">Apotek daring resmi Klinik Makmur Jaya.</p>
      </div>
      <div class="col-lg-6 text-lg-end">
        <a href="katalog.html" class="text-white">&larr; Kembali ke Katalog</a>
      </div>
    </div>
    <div class="footer-bottom text-center">&copy; 2026 Klinik Makmur Jaya.</div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="js/config.js"></script>
<script src="js/data/produk.js"></script>
<script src="js/modules/utils.js"></script>
<script src="js/modules/product.js"></script>
<script src="js/modules/cart.js"></script>
<script src="js/modules/auth.js"></script>
<script src="js/pages/detail-produk.js"></script>
<script src="js/main.js"></script>
</body>
</html>
